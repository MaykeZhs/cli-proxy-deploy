# =============================================================================
#  CPA-Manager-Plus —— CLIProxyAPI 外置用量/计费监控面板
#  独立进程运行，不在代理内、不接管你的凭证；读取 CPA 的 usage 队列做分析
#  启动：docker compose up -d   远程访问请使用 SSH 端口转发
# =============================================================================
services:
  cpa-manager-plus:
    image: seakee/cpa-manager-plus:latest
    container_name: cpa-manager-plus
    restart: unless-stopped
    ports:
      - "127.0.0.1:18317:18317"  # 管理面板仅监听本机，远程访问使用 SSH 转发
    volumes:
      - cpa-manager-plus-data:/data   # SQLite 用量账本持久化
    # 如需通过代理访问外网，可解开下面两行
    # environment:
    #   - HTTPS_PROXY=socks5://127.0.0.1:7890

volumes:
  cpa-manager-plus-data:

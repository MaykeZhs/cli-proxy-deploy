# =============================================================================
#  CLIProxyAPI Docker Compose - CLI Proxy Manager
# =============================================================================

name: cli-proxy-manager

services:
  cliproxyapi:
    image: ${CPA_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: ${CPA_PULL_POLICY:-always}
    container_name: cli-proxy-manager

    restart: unless-stopped
    ports:
      - "${CPA_BIND_HOST:-127.0.0.1}:${CPA_PORT:-8317}:8317"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /CLIProxyAPI/config.yaml
        bind:
          create_host_path: false
      - cpa-auth:/root/.cli-proxy-api
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - cpa-cursor-bridge

volumes:
  cpa-auth:
    name: cli-proxy-manager-auth

networks:
  cpa-cursor-bridge:
    name: cpa-cursor-bridge

# =============================================================================
#  CLIProxyAPI Docker Compose - CLI Proxy Manager
# =============================================================================

name: cli-proxy-manager

services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-manager
    restart: unless-stopped
    ports:
      - "${CPA_BIND_HOST:-127.0.0.1}:${CPA_PORT:-8317}:8317"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /CLIProxyAPI/config.yaml
        bind:
          create_host_path: false
      - cpa-auth:/root/.cli-proxy-api
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cpa-auth:
    name: cli-proxy-manager-auth

worker_processes 1;
# Official nginx image already passes -g 'daemon off;'. Do not set it here.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 32;
}

http {
    # Docker embedded DNS so cursor-bridge can be recreated without a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # One in-flight proxied connection for the whole guard.
    limit_conn_zone $server_name zone=cursor_bridge:1m;
    limit_conn_status 429;

    # Safe access log: method + URI + status only. No Authorization, no body,
    # no Cookie, no query string (args can leak tokens).
    log_format guard_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout guard_safe;

    server_tokens off;
    default_type application/octet-stream;

    client_max_body_size 8m;
    client_body_buffer_size 16k;
    client_body_timeout 300s;
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    keepalive_timeout 65s;

    server {
        listen 8080;
        server_name cursor-bridge-guard;

        set $cursor_bridge_host cursor-bridge;

        proxy_http_version 1.1;
        proxy_set_header Host $cursor_bridge_host:8765;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Cursor-Mode "";
        proxy_set_header X-Cursor-Workspace "";
        proxy_hide_header X-Cursor-Mode;
        proxy_hide_header X-Cursor-Workspace;
        proxy_redirect off;

        location = /guard-health {
            allow 127.0.0.1;
            deny all;
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /v1/models {
            limit_except GET {
                deny all;
            }
            limit_conn cursor_bridge 1;
            proxy_pass http://$cursor_bridge_host:8765;
        }

        location = /v1/chat/completions {
            limit_except POST {
                deny all;
            }
            limit_conn cursor_bridge 1;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            gzip off;
            proxy_set_header X-Accel-Buffering no;
            proxy_pass http://$cursor_bridge_host:8765;
        }

        location / {
            return 404;
        }
    }
}
